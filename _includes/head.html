<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>{{ page.title | default: site.title | default: "Site Title" }}</title>
{%- seo title=false -%}

{% if page.robots %}
<meta name="robots" content="{{ page.robots }}">{% endif %}

{%- unless site.disable_google_fonts -%}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
{%- endunless -%}

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

{%- if jekyll.environment == 'production' and site.google_analytics -%}
{%- include google-analytics.html -%}
{%- endif -%}

<script src="/assets/js/cursor-network.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/d2-lang@latest/dist/d2.min.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.d2').forEach(async (el) => {
    const d2 = await window.d2.default
    const svg = await d2.render(el.textContent)
    el.innerHTML = svg
  })
})
</script>
